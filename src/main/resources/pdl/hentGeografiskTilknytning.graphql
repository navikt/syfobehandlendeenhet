query($ident: ID!) {
    hentGeografiskTilknytning(ident: $ident) {
        gtType
        gtKommune
        gtBydel
        gtLand
    }
    hentPerson(ident: $ident) {
        bostedsadresse(historikk: false) {
            gyldigFraOgMed
            ukjentBosted {
                bostedskommune
            }
        }
        oppholdsadresse(historikk: false) {
            gyldigFraOgMed
            oppholdAnnetSted
        }
    }
}
